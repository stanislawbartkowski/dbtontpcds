# Template for profiles.yml, which is gitignored because the postgres/db2
# targets below carry credentials. Copy this file to profiles.yml (already
# in .gitignore) and adjust host/user/password for your environment:
#
#   cp profile_template.yml profiles.yml
#
# The dev_duckdb and dev_spark targets need no setup beyond what's in the
# README's "Spark Connect" section. The dev_postgres and dev_db2 targets
# need a database/role created first - see the README's "Postgres" and
# "Db2" sections.
#
# The dev_databricks target reads its connection settings from environment
# variables (dbt-databricks adapter must be installed: pip install dbt-databricks):
#
#   export DBT_DATABRICKS_HOST=adb-1234567890123456.7.azuredatabricks.net  # no https://
#   export DBT_DATABRICKS_HTTP_PATH=/sql/1.0/warehouses/<warehouse-id>
#   export DBT_DATABRICKS_TOKEN=<personal-access-token>
#   export DBT_CATALOG=main   # optional, defaults to main
#   export DBT_SCHEMA=tpc     # optional, defaults to tpc

sample_project:
  outputs:
    dev_duckdb:
      type: duckdb
      path: dev.duckdb
      threads: 4
    dev_spark:
      type: spark
      method: session
      host: localhost
      schema: default
      threads: 4
      server_side_parameters:
        spark.remote: "sc://localhost:15002"
    dev_postgres:
      type: postgres
      host: localhost
      port: 5432
      user: tpc
      password: secret
      dbname: tpc_data
      schema: public
      threads: 4
    dev_db2:
      type: ibmdb2
      host: localhost
      port: 25000
      database: TPC_DATA
      user: db2inst1
      password: secret
      schema: TPC
      threads: 4
    dev_databricks:
      type: databricks
      host: "{{ env_var('DBT_DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DBT_DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DBT_DATABRICKS_TOKEN') }}"
      catalog: "{{ env_var('DBT_CATALOG', 'main') }}"
      schema: "{{ env_var('DBT_SCHEMA', 'tpc') }}"
      threads: 4
  target: dev_duckdb
