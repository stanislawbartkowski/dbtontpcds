# Checked into the repo: every real credential below (Databricks token,
# Postgres user/password, Spark connection details) is read from an
# environment variable with no hardcoded default, so this file itself
# carries no secrets - source .env (gitignored) before running dbt.
#
# The dev_duckdb and dev_spark targets need no setup beyond what's in the
# README's "Spark Connect" section. The dev_postgres and dev_db2 targets
# need a database/role created first - see the README's "Postgres" and
# "Db2" sections.
#
# The dev_databricks target reads its connection settings from environment
# variables (dbt-databricks adapter must be installed: pip install dbt-databricks):
#
#   export DBT_DATABRICKS_HOST=adb-1234567890123456.7.azuredatabricks.net  # no https://
#   export DBT_DATABRICKS_HTTP_PATH=/sql/1.0/warehouses/<warehouse-id>
#   export DBT_DATABRICKS_TOKEN=<personal-access-token>
#   export DBT_CATALOG=main   # optional, defaults to main
#   export DBT_SCHEMA=tpc     # optional, defaults to tpc
#
# The dev_spark target also reads its connection settings from environment
# variables, all optional (defaults shown - a local Spark Connect server
# needs none of this set):
#
#   export DBT_SPARK_HOST=localhost
#   export DBT_SPARK_SCHEMA=default
#   export DBT_SPARK_REMOTE=sc://localhost:15002
#
# The dev_postgres target also reads its connection settings from
# environment variables. HOST, USER, PASSWORD, and SCHEMA are required
# (no default); only PORT and DBNAME have defaults:
#
#   export DBT_POSTGRES_HOST=<host>
#   export DBT_POSTGRES_PORT=5432             # optional, defaults to 5432
#   export DBT_POSTGRES_USER=<user>
#   export DBT_POSTGRES_PASSWORD=<password>
#   export DBT_POSTGRES_DBNAME=tpc_data       # optional, defaults to tpc_data
#   export DBT_POSTGRES_SCHEMA=<schema>
#
# The default target below is read from DBT_TARGET - set it (e.g.
# `export DBT_TARGET=dev_databricks`) to switch it without passing
# --target on every dbt command. Left unset, it falls back to dev_duckdb,
# which needs no credentials.

sample_project:
  outputs:
    dev_duckdb:
      type: duckdb
      path: dev.duckdb
      threads: 4
    dev_spark:
      type: spark
      method: session
      host: "{{ env_var('DBT_SPARK_HOST', 'localhost') }}"
      schema: "{{ env_var('DBT_SPARK_SCHEMA', 'default') }}"
      threads: 4
      server_side_parameters:
        spark.remote: "{{ env_var('DBT_SPARK_REMOTE', 'sc://localhost:15002') }}"
    dev_postgres:
      type: postgres
      host: "{{ env_var('DBT_POSTGRES_HOST') }}"
      port: "{{ env_var('DBT_POSTGRES_PORT', '5432') | int }}"
      user: "{{ env_var('DBT_POSTGRES_USER') }}"
      password: "{{ env_var('DBT_POSTGRES_PASSWORD') }}"
      dbname: "{{ env_var('DBT_POSTGRES_DBNAME', 'tpc_data') }}"
      schema: "{{ env_var('DBT_POSTGRES_SCHEMA') }}"
      threads: 4
    dev_db2:
      type: ibmdb2
      host: localhost
      port: 25000
      database: TPC_DATA
      user: db2inst1
      password: secret
      schema: TPC
      threads: 4
    dev_databricks:
      type: databricks
      host: "{{ env_var('DBT_DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DBT_DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DBT_DATABRICKS_TOKEN') }}"
      catalog: "{{ env_var('DBT_CATALOG', 'main') }}"
      schema: "{{ env_var('DBT_SCHEMA', 'tpc') }}"
      threads: 4
      # Disables the SQL warehouse's query result cache for every connection
      # dbt opens against this target, so benchmark timings always reflect a
      # fresh execution instead of a cached result from an earlier identical
      # query (forwarded as-is to databricks.sql.connect()).
      connection_parameters:
        use_cached_result: false
  target: "{{ env_var('DBT_TARGET', 'dev_duckdb') }}"
  